<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SwadBox - Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<section class="auth-container">

    <div class="auth-box">

        <div class="auth-logo">

            <img src="Logo.png" alt="SwadBox">

        </div>

        <h2>Welcome to BiteBox</h2>

        <p class="auth-subtitle">
            Login to order your favourite food
        </p>

        <form onsubmit="loginUser(event)">

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter Email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</section>

<script src="scripts.js"></script>

</body>

</html>
